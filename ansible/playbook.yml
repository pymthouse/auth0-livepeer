---
# Single-VM clearinghouse runtime deploy (Kafka + remote signer + collector).
# Prerequisites on operator workstation:
#   npm run bootstrap  →  .env.livepeer
#   Set REMOTE_SIGNER_WEBHOOK_URL to live Vercel platform URL
#
# Run:
#   CLEARINGHOUSE_HOST=1.2.3.4 ansible-playbook -i inventory/single.yml playbook.yml \
#     --extra-vars "@../.env.livepeer"

- name: Deploy clearinghouse runtime stack
  hosts: clearinghouse
  become: true
  vars:
    clearinghouse_dir: /opt/clearinghouse
    repo_src: "{{ playbook_dir }}/.."
  tasks:
    - name: Install Docker prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true
      when: ansible_os_family == "Debian"

    - name: Add Docker GPG key
      ansible.builtin.shell: |
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg \
          | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        chmod a+r /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }}
          signed-by=/etc/apt/keyrings/docker.gpg]
          https://download.docker.com/linux/{{ ansible_distribution | lower }}
          {{ ansible_distribution_release }} stable
        filename: docker
        state: present
      when: ansible_os_family == "Debian"

    - name: Install Docker Engine and Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true
      when: ansible_os_family == "Debian"

    - name: Ensure clearinghouse directory exists
      ansible.builtin.file:
        path: "{{ clearinghouse_dir }}"
        state: directory
        mode: "0750"

    - name: Sync deploy artifacts
      ansible.builtin.copy:
        src: "{{ repo_src }}/deploy/"
        dest: "{{ clearinghouse_dir }}/deploy/"
        mode: preserve

    - name: Install .env.livepeer
      ansible.builtin.copy:
        src: "{{ repo_src }}/.env.livepeer"
        dest: "{{ clearinghouse_dir }}/.env.livepeer"
        mode: "0600"

    - name: Start clearinghouse stack
      ansible.builtin.command:
        cmd: docker compose -f deploy/docker-compose.yml --env-file .env.livepeer up -d --build
        chdir: "{{ clearinghouse_dir }}"
      register: compose_up
      changed_when: "'Started' in compose_up.stdout or 'Built' in compose_up.stdout or 'Creating' in compose_up.stdout"

    - name: Show compose status
      ansible.builtin.command:
        cmd: docker compose -f deploy/docker-compose.yml --env-file .env.livepeer ps
        chdir: "{{ clearinghouse_dir }}"
      register: compose_ps
      changed_when: false

    - name: Compose ps
      ansible.builtin.debug:
        var: compose_ps.stdout_lines
